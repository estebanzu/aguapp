<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#FFFDF7" stroke="#B8C9A3" stroke-width="3"/>
  
  <!-- Bear sitting on book -->
  <!-- Book -->
  <rect x="55" y="130" width="90" height="12" rx="3" fill="#C9886E"/>
  <rect x="58" y="128" width="84" height="8" rx="2" fill="#E8DCC8"/>
  <line x1="100" y1="128" x2="100" y2="136" stroke="#D4A5A5" stroke-width="1.5"/>
  
  <!-- Bear body -->
  <ellipse cx="100" cy="110" rx="28" ry="24" fill="#C4A77D"/>
  
  <!-- Bear head -->
  <circle cx="100" cy="75" r="24" fill="#C4A77D"/>
  
  <!-- Ears -->
  <circle cx="79" cy="56" r="10" fill="#C4A77D"/>
  <circle cx="79" cy="56" r="6" fill="#D4A5A5"/>
  <circle cx="121" cy="56" r="10" fill="#C4A77D"/>
  <circle cx="121" cy="56" r="6" fill="#D4A5A5"/>
  
  <!-- Eyes -->
  <circle cx="91" cy="72" r="4" fill="#4A4A4A"/>
  <circle cx="109" cy="72" r="4" fill="#4A4A4A"/>
  <circle cx="92" cy="71" r="1.5" fill="white"/>
  <circle cx="110" cy="71" r="1.5" fill="white"/>
  
  <!-- Nose -->
  <ellipse cx="100" cy="79" rx="3.5" ry="2.5" fill="#4A4A4A"/>
  
  <!-- Mouth -->
  <path d="M 94 83 Q 100 88 106 83" fill="none" stroke="#4A4A4A" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Cheeks -->
  <circle cx="83" cy="81" r="4" fill="#D4A5A5" opacity="0.5"/>
  <circle cx="117" cy="81" r="4" fill="#D4A5A5" opacity="0.5"/>
  
  <!-- Arms holding book -->
  <ellipse cx="72" cy="108" rx="7" ry="12" fill="#C4A77D" transform="rotate(-10 72 108)"/>
  <ellipse cx="128" cy="108" rx="7" ry="12" fill="#C4A77D" transform="rotate(10 128 108)"/>
  
  <!-- Floating icons around -->
  <!-- Star (top left) -->
  <polygon points="45,45 47,51 53,51 48,55 50,61 45,57 40,61 42,55 37,51 43,51" fill="#E8C97A" opacity="0.8"/>
  
  <!-- Heart (top right) -->
  <path d="M 150 42 C 150 38, 156 38, 156 42 C 156 48, 150 52, 150 52 C 150 52, 144 48, 144 42 C 144 38, 150 38, 150 42" fill="#D4A5A5" opacity="0.8"/>
  
  <!-- Circle (left) -->
  <circle cx="38" cy="95" r="7" fill="none" stroke="#7BA7BC" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Triangle (right) -->
  <polygon points="165,88 172,100 158,100" fill="none" stroke="#B8C9A3" stroke-width="2.5" opacity="0.8"/>
  
  <!-- Number 3 (bottom left) -->
  <text x="42" y="145" font-family="Nunito, sans-serif" font-size="16" font-weight="bold" fill="#C9886E" opacity="0.8">3</text>
  
  <!-- Paw print (bottom right) -->
  <circle cx="158" cy="140" r="4" fill="#B8C9A3" opacity="0.8"/>
  <circle cx="152" cy="135" r="2.5" fill="#B8C9A3" opacity="0.8"/>
  <circle cx="160" cy="133" r="2.5" fill="#B8C9A3" opacity="0.8"/>
  <circle cx="166" cy="136" r="2.5" fill="#B8C9A3" opacity="0.8"/>
  
  <!-- Text -->
  <text x="100" y="170" text-anchor="middle" font-family="Nunito, sans-serif" font-size="18" font-weight="800" fill="#4A4A4A">Petit Monde</text>
</svg>
